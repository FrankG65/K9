[workspace]
resolver = "2"
members = ["crates/k9-core", "crates/k9-agent", "crates/k9-cli", "crates/k9-dienst", "crates/k9-doc", "crates/k9-res", "crates/k9-testsim"]

[workspace.package]
version = "0.50.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
k9-core = { path = "crates/k9-core" }
k9-res = { path = "crates/k9-res" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rusqlite = { version = "0.42", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
getrandom = "0.3"
memchr = "2"
walkdir = "2"
keyring = { version = "3", features = ["windows-native"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "rustls", "ring", "webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
axum = { version = "0.8", features = ["form", "query"] }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
tempfile = "3"
windows-service = "0.8"
ring = "0.17"
yara-x = "1.23"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_TaskScheduler",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Services",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_EventLog",
    "Win32_System_Wmi",
    "Win32_System_Time",
    "Win32_System_RemoteDesktop",
    "Win32_System_Environment",
    "UI_Notifications",
    "Data_Xml_Dom",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
